name: 🧪 Run Tests
on:
  workflow_call:

env:
  GODOT_VERSION: '4.7-stable'

jobs:
  run-unit-tests:
    name: Run Unit Tests ${{ matrix.dimensions.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dimensions:
          - { name: 2D, feature: single-dim2 }
          - { name: 3D, feature: single-dim3 }
    steps:
      - uses: actions/checkout@v6
      - name: Run Unit Tests
        shell: bash
        run: |
          cargo test --all-targets --features="${{ matrix.dimensions.feature }},test,register-docs,api-4-7"

